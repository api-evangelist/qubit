description: 'QuBit was a London-based ecommerce personalization and product-discovery
  platform — customer-experience optimization, recommendations, A/B testing, and behavioral
  big-data analytics — backed by Accel, Balderton Capital, and Sapphire Ventures. QuBit
  was acquired by Coveo in 2021 and fully absorbed into the Coveo Merchandising Hub.
  The qubit.com domain, its developer docs (docs.qubit.com), and every API and /.well-known/
  endpoint now redirect to coveo.com and docs.coveo.com, so QuBit no longer operates
  an independent public API surface.'
